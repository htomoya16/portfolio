model = "gpt-5.5"
model_reasoning_effort = "high"
web_search = "live"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[plugins."github@openai-curated"]
enabled = true

[projects."/home/hasiyuto/workbench/raspi-vpn-wol"]
trust_level = "trusted"

[projects."/home/hasiyuto/workbench/Portfolio"]
trust_level = "trusted"

[projects."/home/hasiyuto/workbench/Chatclub"]
trust_level = "trusted"

[projects."/home/hasiyuto/workbench/Atcoder"]
trust_level = "trusted"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]
